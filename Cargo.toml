[workspace]
resolver = "2"
members = [
    "hive_base",
    "agents/worker",
    "agents/drone",
    "agents/honeybee",
    "agents/queen",
    "agents/swarm",
    "stinger",
    "beekeeper",
    "buzz",
    "c2",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.82"
description = "Hive Colony v3.0 — Multi-Agent Autonomous Red Team Framework"
authors = ["Hive Colony Team"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Note: panic = "unwind" (default) is intentional — worker relies on
# std::panic::catch_unwind for the ML classifier fallback path, which is
# impossible with panic = "abort".

