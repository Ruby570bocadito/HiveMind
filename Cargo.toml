[workspace]
resolver = "2"
members = [
    "hive_base",
    "agents/worker",
    "agents/drone",
    "agents/honeybee",
    "agents/queen",
    "stinger",
    "beekeeper",
    "buzz",
    "c2",
    "loom-model",
]

# stinger embeds release binaries (include_bytes! on target/release/*),
# so it must be built explicitly AFTER a release build:
#   cargo build --release -p worker -p drone -p honeybee -p queen
#   cargo build -p stinger
default-members = [
    "hive_base",
    "agents/worker",
    "agents/drone",
    "agents/honeybee",
    "agents/queen",
    "beekeeper",
    "buzz",
    "c2",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.82"
description = "Hive Colony v3.0 — multi-agent swarm framework for isolated lab environments (zero attack payloads since ronda 6)"
authors = ["Hive Colony Team"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Note: panic = "unwind" (default) is intentional — worker relies on
# std::panic::catch_unwind for the ML classifier fallback path, which is
# impossible with panic = "abort".

