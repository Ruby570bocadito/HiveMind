# Hive Colony Configuration
# Loaded automatically by every agent (see hive_base::config::HiveConfig::load).
# Override per environment: copy this file and edit, or set env vars
# (see docs/OPERATOR_GUIDE.md for the full variable reference).
#
# Ronda 6: el build ya no contiene módulos ofensivos ni simulados
# (exploits/exfil/saboteur/leech/persistencia/evasión eliminados).

[arena]
name_prefix = "swarm_"
max_messages = 2048
max_message_size = 8192
max_agents = 16

[heartbeat]
interval_secs = 10
timeout_secs = 30

[consensus]
threshold = 0.66
hoarder_threshold = 0.80
default_reputation = 1.0
decay_rate_per_hour = 0.2
reward_delta = 0.1
penalty_delta = 0.2

[agents]
scout_scan_interval_secs = 15
shaper_decision_interval_secs = 5
edr_processes = ["csfalcon", "csagent", "msmpeng", "sentinelone", "carbonblack", "cylancesvc", "symantec", "mcafee"]
backup_processes = ["veeam", "backup_exec", "commvault", "netbackup", "backup_agent", "vss"]

[c2]
# Default C2 endpoint. The bundled Rust C2 server (c2/) is plain HTTP on 8444
# unless you terminate TLS in front of it (reverse proxy, etc.).
url = "http://localhost:8444"  # BASE del C2 (el poller añade /task y /beacon)
api_key = ""
http_user_agents = [
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0",
    "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/119.0.0.0",
]
cdn_hosts = ["cdn.jsdelivr.net", "cdnjs.cloudflare.com"]

[limits]
max_processes = 20
max_disk_mb = 100
max_network_mbps = 1.0
business_hours_only = true

# ── BRAIN CONFIG ────────────────────────────────────────────────────────
# Hosts que el enjambre NUNCA toca (máquina del operador, C2, etc.).
# El gate BRAIN se consulta antes de cualquier acción de red.

[brain]
safe_ips = [
    "192.168.1.100",   # operator workstation
    "192.168.1.1",     # gateway/router
]
safe_hostnames = [
    "operator-pc",
    "c2-server",
    "swarm-master",
]

# ── TIMING CONFIG ──────────────────────────────────────────────────────
[timing]
heartbeat_interval_secs = 10
dead_agent_timeout_secs = 30
regeneration_cooldown_secs = 60
consensus_timeout_secs = 30
decision_interval_secs = 30
scan_interval_secs = 15
mutation_interval_secs = 120
