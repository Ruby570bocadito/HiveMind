apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hive-colony.fullname" . }}-c2
  labels: {{- include "hive-colony.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: c2
      {{- include "hive-colony.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: c2
        {{- include "hive-colony.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hive-colony.serviceAccountName" . }}
      containers:
      - name: c2
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/hive/bin/c2-server", "--port", "8444", "--db-path", "/hive/c2.db"]
        ports:
        - containerPort: 8444
          name: http
        securityContext: {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: arena
          mountPath: /dev/shm
        envFrom:
        - configMapRef:
            name: {{ include "hive-colony.fullname" . }}-config
      volumes:
      - name: arena
        hostPath:
          path: {{ .Values.arena.hostPath }}
          type: Directory
---
{{- range $agent := list "queen" "worker" "drone" "honeybee" }}
{{- if index $.Values.agents $agent "enabled" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hive-colony.fullname" $ }}-{{ $agent }}
  labels: {{- include "hive-colony.labels" $ | nindent 4 }}
spec:
  replicas: {{ index $.Values.agents $agent "replicas" }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $agent }}
      {{- include "hive-colony.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $agent }}
        {{- include "hive-colony.selectorLabels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hive-colony.serviceAccountName" $ }}
      hostPID: {{ $.Values.podSecurity.hostPID }}
      hostNetwork: {{ $.Values.podSecurity.hostNetwork }}
      containers:
      - name: {{ $agent }}
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        command: ["/hive/bin/{{ $agent }}"]
        securityContext: {{- toYaml $.Values.securityContext | nindent 10 }}
        env:
        - name: __HIVE_ARENA
          value: {{ $.Values.arena.name | quote }}
        envFrom:
        - configMapRef:
            name: {{ include "hive-colony.fullname" $ }}-config
        resources: {{- index $.Values.agents $agent "resources" | toYaml | nindent 10 }}
        volumeMounts:
        - name: arena
          mountPath: /dev/shm
      volumes:
      - name: arena
        hostPath:
          path: {{ $.Values.arena.hostPath }}
          type: Directory
      tolerations: {{- $.Values.tolerations | toYaml | nindent 8 }}
{{- end }}
{{- end }}
