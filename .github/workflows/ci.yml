name: Hive CI

# Ronda 12: triggers extendidos a [master, main] (ambas ramas existen).
# Nota de auditoria ronda 12: los triggers ya eran validos desde la
# ronda 9 ("branches: [master]"); una trampa de renderizado en la
# herramienta de auditoria (un filtro que elimina subcadenas tipo
# escape ANSI "[...m" del texto mostrado) hizo que esta ronda los
# leyera como "aster]" y los diera por rotos durante 3 rondas. La
# leccion queda documentada: verificar los ficheros de CI a nivel de
# bytes/YAML, nunca solo a traves del renderizado de texto.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Ronda 13: `CARGO_TERM_COLOR` estaba indentado DENTRO de `on:` — GitHub lo
# leía como un activity type desconocido y el workflow moría al instante sin
# lanzar ningún job (todos los runs desde la ronda 9 son "failure" con 0
# jobs). El YAML parsea, por eso la trampa sobrevivió a auditorías de
# sintaxis: la estructura es válida, la UBICACIÓN no. Pertenece a `env:`.
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # default-members: stinger requires release binaries that a clean
      # checkout does not have (its build.rs degrades gracefully, but we keep
      # it out of the test matrix).
      - name: Tests (unit + integration + c2, incl. ML roundtrip on the embedded model)
        run: cargo test --no-fail-fast -- --test-threads=2
      - name: Build agent binaries and C2 server
        run: cargo build -p worker -p drone -p honeybee -p queen -p c2-server

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Blocking gates since ronda 9 (clippy was surfaced-only before): the
      # tree is clean today, so warnings and fmt drift fail the build instead
      # of piling up.
      - name: rustfmt (gate)
        run: cargo fmt --check
      - name: Clippy (gate — zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  loom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Exhaustive interleaving models over the REAL shared_arena.rs, pulled
      # in by loom-model via #[path] and compiled with --cfg loom (atomic
      # shims + shrunken MAX_AGENTS/MAX_MESSAGES). loom-model is a workspace
      # member but NOT in default-members, so `cargo test` above never pays
      # for it — this job runs it explicitly.
      - name: Loom — arena concurrency models
        env:
          LOOM_MAX_PREEMPTIONS: "2"
        run: RUSTFLAGS="--cfg loom" cargo test -p loom-model --release

  training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Ronda 9: end-to-end instead of py_compile. The committed .bin would
      # mask a broken export in an existence check, so the parity validation
      # inside train_classifier.py (via export_bin.py --validate) is the real
      # gate and the script exits non-zero on failure.
      - name: Install ML deps (converter subset)
        run: pip install --quiet pandas scikit-learn joblib numpy
      - name: Generate dataset
        run: python3 training/scout/generate_dataset.py
      - name: Train + export + parity-validate
        run: python3 training/scout/train_classifier.py
      - name: Assert the .bin artifact exists and is fresh
        run: |
          test -s agents/worker/models/scout_classifier.bin
          ls -lh agents/worker/models/

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p worker -p drone -p honeybee -p queen
      - run: ls -lh target/release/worker target/release/drone target/release/honeybee target/release/queen
      # Ronda 9: actually upload the artifacts (the ROADMAP promised this).
      - uses: actions/upload-artifact@v4
        with:
          name: hive-agents-${{ github.sha }}
          path: |
            target/release/worker
            target/release/drone
            target/release/honeybee
            target/release/queen
          if-no-files-found: error
