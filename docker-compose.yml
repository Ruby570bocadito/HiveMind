services:
  c2-server:
    build: .
    container_name: hive-c2
    ports: ["8444:8444"]
    command: /hive/bin/c2-server --port 8444 --db-path /hive/c2.db

  queen:
    build: .
    container_name: hive-queen
    depends_on: [c2-server]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_TELEMETRY_DIR=/tmp/hive_telemetry
      - HIVE_C2_URL=http://c2-server:8444/beacon
      - HIVE_C2_DNS_DOMAIN=tunnel.example.com
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/queen
    ports: ["4200:4200"]

  worker:
    build: .
    container_name: hive-worker
    depends_on: [queen]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_C2_URL=http://c2-server:8444/beacon
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/worker

  honeybee:
    build: .
    container_name: hive-honeybee
    depends_on: [queen, c2-server]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_TELEMETRY_DIR=/tmp/hive_telemetry
      - HIVE_C2_URL=http://c2-server:8444/beacon
      - HIVE_C2_DNS_DOMAIN=tunnel.example.com
      - HIVE_EXEC_TIMEOUT=30
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/honeybee

  drone:
    build: .
    container_name: hive-drone
    depends_on: [queen]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_C2_URL=http://c2-server:8444/beacon
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/drone

  monitor:
    build: .
    container_name: hive-monitor
    depends_on: [queen]
    volumes:
      - hive_arena:/dev/shm
    command: python3 /hive/tests/monitor_detections.py --watch --interval 10

  dashboard:
    build: .
    container_name: hive-dashboard
    depends_on: [c2-server]
    ports: ["8080:8080"]
    volumes:
      - /tmp:/tmp
      - /var/log:/var/log:ro
    command: python3 /hive/tests/dashboard.py --port 8080 --host 0.0.0.0

  ollama:
    image: ollama/ollama:latest
    container_name: hive-ollama
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["llm"]

volumes:
  hive_arena:
    driver_opts:
      type: tmpfs
      device: tmpfs
  ollama_data:
