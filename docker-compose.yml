services:
  c2-server:
    build: .
    container_name: hive-c2
    ports: ["8444:8444"]
    command: /hive/bin/c2-server --port 8444 --db-path /hive/c2.db

  queen:
    build: .
    container_name: hive-queen
    depends_on: [c2-server]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_TELEMETRY_DIR=/tmp/hive_telemetry
      - HIVE_C2_URL=http://c2-server:8444
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/queen

  worker:
    build: .
    container_name: hive-worker
    depends_on: [queen]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_C2_URL=http://c2-server:8444
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/worker

  honeybee:
    build: .
    container_name: hive-honeybee
    depends_on: [queen, c2-server]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_TELEMETRY_DIR=/tmp/hive_telemetry
      - HIVE_C2_URL=http://c2-server:8444
      - HIVE_EXEC_TIMEOUT=30
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/honeybee

  drone:
    build: .
    container_name: hive-drone
    depends_on: [queen]
    environment:
      - __HIVE_ARENA=hive_arena
      - HIVE_LAB_MODE=1
      - HIVE_C2_URL=http://c2-server:8444
      - RUST_LOG=info
    volumes:
      - hive_arena:/dev/shm
    command: /hive/bin/drone

  monitor:
    build: .
    container_name: hive-monitor
    depends_on: [queen]
    volumes:
      - hive_arena:/dev/shm
    command: python3 /hive/tests/monitor_detections.py --watch --interval 10

  # Ronda 13: the separate dashboard service (tests/dashboard.py, :8080) is
  # gone — the Rust C2 serves the operator web console itself on GET /
  # (http://localhost:8444). One port, one process, live API data.

  ollama:
    image: ollama/ollama:latest
    container_name: hive-ollama
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["llm"]

volumes:
  hive_arena:
    driver_opts:
      type: tmpfs
      device: tmpfs
  ollama_data:
